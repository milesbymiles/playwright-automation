[pytest]
pythonpath = .
testpaths = tests
addopts =
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=reports/artifacts
markers =
    ui: browser based tests
    api: api tests
    smoke: quick sanity tests
    regression: full regression tests
