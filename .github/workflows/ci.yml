name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test"
        type: choice
        options: [int, stg, prod]
        default: int
      browser:
        description: "Browser (safari = WebKit)"
        type: choice
        options: [chrome, firefox, safari, all]
        default: chrome
      test_type:
        description: "Which tests to run"
        type: choice
        options: [all, smoke, regression]
        default: all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Pick browser (chrome -> chromium, safari -> webkit)
        run: |
          case "${{ inputs.browser }}" in
            firefox) INSTALL=firefox;  ARGS="--browser firefox" ;;
            safari)  INSTALL=webkit;   ARGS="--browser webkit" ;;
            all)     INSTALL="chromium firefox webkit"; ARGS="--all-browsers" ;;
            *)       INSTALL=chromium; ARGS="--browser chromium" ;;
          esac
          echo "INSTALL_BROWSERS=$INSTALL" >> $GITHUB_ENV
          echo "BROWSER_ARGS=$ARGS" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps $INSTALL_BROWSERS

      - name: Run smoke tests (fast gate)
        if: inputs.test_type != 'regression'
        run: pytest -m smoke $BROWSER_ARGS
        env:
          TEST_ENV: ${{ inputs.environment || 'int' }}

      - name: Run remaining tests
        if: inputs.test_type != 'smoke'
        run: pytest -m "not smoke" $BROWSER_ARGS
        env:
          TEST_ENV: ${{ inputs.environment || 'int' }}
          # Optional: if set, the password is read from Vault (see config/secrets.py)
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
